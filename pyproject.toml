[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-photo-cull"
version = "0.1.0"
description = "Read-only photo cull: duplicate and burst grouping plus blur and exposure suggestions, with a pluggable decision-model backend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.4",
]

[project.optional-dependencies]
heif = ["pillow-heif>=0.16"]
dev = ["pytest>=8.0"]

[project.scripts]
jev-photo-cull = "jev_photo_cull.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
